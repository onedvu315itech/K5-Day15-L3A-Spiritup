# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 300
  base: 700
  high: 1000
  source: "[Cần bổ sung thông tin] Nhóm khách du lịch tự túc tại Việt Nam (tự ước tính; cần thay bằng nguồn công khai có link nếu có)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1 (từ khảo sát evidence/survey/results.csv, n=43 người dùng mục tiêu)
  - name: dung_it
    share: 0.72              # 31/43 người đi 1-2 lần/năm (khảo sát Q2)
    uses_per_month: 0.2      # ~2 chuyến/năm (khảo sát Q2)
    turns_per_session: 1     # lập lịch 1 lần, ít sửa (khảo sát Q8)
    source: "khảo sát evidence/survey/results.csv (n=43, Q2 & Q8)"
  - name: dung_vua
    share: 0.23              # 10/43 người đi 3-5 lần/năm (khảo sát Q2)
    uses_per_month: 0.4      # ~4-5 chuyến/năm (khảo sát Q2)
    turns_per_session: 2     # sửa lịch 1-2 lần/chuyến (65,1% ở Q8)
    source: "khảo sát evidence/survey/results.csv (n=43, Q2 & Q8)"
  - name: dung_nhieu
    share: 0.05              # 2/43 người đi >=6 lần/năm (khảo sát Q2)
    uses_per_month: 1.0      # ~1 chuyến/tháng (khảo sát Q2)
    turns_per_session: 4     # sửa lịch >=3 lần/chuyến (11,6% ở Q8)
    source: "khảo sát evidence/survey/results.csv (n=43, Q2 & Q8)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ original-guide/further-reading/model-prices.md. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (model-prices.md)"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (model-prices.md, bằng giá gemini-3.8-flash từ 01/2027)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
